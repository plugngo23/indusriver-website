<style>
:root{--bg:#081729;--mint:#dfb36b;--gold:#dfb36b;--ink:#f5f7fb;--mut:#b0bfd2;

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(900px 520px at 50% 0%,#17436e 0%,transparent 70%),radial-gradient(600px 400px at 100% 100%,#102d4c,transparent 70%),var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow-x:hidden;display:grid;place-items:center;padding:24px}
/* perspective floor grid */
.floor{position:fixed;left:-50%;right:-50%;bottom:-10%;height:55%;background:linear-gradient(transparent 0,rgba(223,179,107,.0) 0),repeating-linear-gradient(90deg,rgba(223,179,107,.18) 0 1px,transparent 1px 60px),repeating-linear-gradient(0deg,rgba(223,179,107,.18) 0 1px,transparent 1px 60px);transform:perspective(500px) rotateX(62deg);mask-image:linear-gradient(to top,#000 30%,transparent 95%);-webkit-mask-image:linear-gradient(to top,#000 30%,transparent 95%);pointer-events:none}

h1{margin:8px 0 8px;font-size:30px;transform:translateZ(55px);text-shadow:0 6px 14px rgba(0,0,0,.5)}
p{margin:0 0 22px;color:var(--mut);line-height:1.55;transform:translateZ(25px)}
.go{display:block;transform:translateZ(60px);background:linear-gradient(180deg,#f3d497,#d7a651);color:#12243b;font-weight:800;text-decoration:none;padding:16px;border-radius:16px;font-size:17px;box-shadow:0 8px 0 #8f692f,0 20px 26px rgba(0,0,0,.5);transition:transform .12s,box-shadow .12s}

.links{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px;transform:translateZ(35px)}

.phone{width:120px;height:240px;border-radius:24px;background:linear-gradient(145deg,#283d57,#091628);border:3px solid #59738f;left:2%;top:8%;transform:translateZ(110px) rotateY(28deg) rotateZ(-8deg);box-shadow:0 30px 50px rgba(0,0,0,.6),inset 0 0 0 2px #061323}
.phone i{position:absolute;inset:9px;border-radius:17px;background:linear-gradient(160deg,#347eb7,#102d4c 60%,#d7a651 140%)}
.phone b{position:absolute;top:14px;left:50%;width:38px;height:9px;margin-left:-19px;border-radius:6px;background:#061323}
.laptop{right:0;bottom:6%;width:210px;height:140px;transform:translateZ(90px) rotateY(-26deg) rotateZ(5deg);animation-delay:-3s}
.laptop .scr{position:absolute;inset:0 0 18px 0;border-radius:10px 10px 4px 4px;background:linear-gradient(160deg,#4e97cf,#102d4c 65%);border:4px solid #59738f;box-shadow:0 26px 44px rgba(0,0,0,.6)}
.laptop .base{position:absolute;left:-14px;right:-14px;bottom:0;height:18px;border-radius:4px 4px 14px 14px;background:linear-gradient(#93a9c0,#435d79)}
.coin{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff3c0,#d7a651 60%,#8f692f);right:8%;top:6%;transform:translateZ(130px);animation-delay:-1.5s;box-shadow:0 14px 20px rgba(0,0,0,.5)}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -16px}}
@media(max-width:700px){.phone{left:-6%;top:-2%;transform:translateZ(100px) rotateY(28deg) rotateZ(-8deg) scale(.6)}.laptop{right:-6%;bottom:-3%;transform:translateZ(80px) rotateY(-26deg) rotateZ(5deg) scale(.6)}.coin{right:2%;top:-3%;transform:translateZ(120px) scale(.7)}}
@media(prefers-reduced-motion:reduce){.dev{animation:none}.tilt{transition:none}}

/* Keep floating objects beside the card and all actions reachable. */
body{min-height:100svh;height:auto;padding:65px 24px;overflow-x:clip}
html{height:auto;min-height:100%}.stage{min-height:600px}.tilt{isolation:isolate}.card{z-index:1}
.phone{left:-145px;top:65px}.laptop{right:-190px;bottom:75px}.coin{right:-70px;top:0}
.whatsapp{display:block;margin-top:23px;color:var(--mint);font-size:14px;font-weight:700;text-underline-offset:5px;transform:translateZ(35px)}
a:focus-visible{outline:3px solid var(--gold);outline-offset:5px}.trust{font-size:11px;gap:7px 13px;margin-top:18px}
@media(max-width:900px){.phone{left:-100px;transform:translateZ(70px) rotateY(28deg) rotateZ(-8deg) scale(.75)}.laptop{right:-120px;transform:translateZ(60px) rotateY(-26deg) rotateZ(5deg) scale(.75)}.coin{right:-20px}}
@media(max-width:700px){body{padding:60px 18px 52px}.stage{min-height:0}.tilt{max-width:430px}.card{padding:55px 23px 27px;border-radius:27px}.phone{left:-42px;top:-70px;transform:translateZ(40px) rotateY(28deg) rotateZ(-13deg) scale(.38);transform-origin:50% 50%;z-index:2}.laptop{right:-49px;bottom:-90px;transform:translateZ(30px) rotateY(-26deg) rotateZ(7deg) scale(.38);z-index:2}.coin{right:4px;top:-23px;transform:translateZ(40px) scale(.6);z-index:2}.pn{width:74px;height:74px;border-radius:21px;font-size:29px;margin-bottom:18px}.brand{font-size:10px;letter-spacing:2.4px}h1{font-size:clamp(23px,6.8vw,30px);line-height:1.2;margin:12px 0}p{font-size:14px;line-height:1.65;margin-bottom:23px}.go{font-size:16px}.links{gap:10px}.links a{font-size:13px;padding:14px 7px}.whatsapp{font-size:13px}.trust{font-size:10px}}
@media(prefers-reduced-motion:reduce){.tilt{transform:none!important}.dev{animation:none!important}}


/* Glossy bubble response: window-wide pointer tracking and layered depth. */
.tilt{transition:none;will-change:transform;transform:translate3d(var(--drift-x,0px),var(--drift-y,0px),0) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
.card{border-radius:42px;background:radial-gradient(ellipse at var(--mx,50%) var(--my,30%),rgba(223,179,107,.20),transparent 65%),linear-gradient(145deg,rgba(29,57,88,.94),rgba(10,27,47,.97));box-shadow:0 40px 85px #0009,inset 0 2px 2px #ffffff40,inset 0 -4px 10px #0005}
.card:before{background:radial-gradient(ellipse at var(--mx,50%) var(--my,30%),#ffffff30,transparent 48%);border:1px solid #ffffff0d;transform:translateZ(2px)}
.pn{transform:translateZ(95px)}h1{transform:translateZ(75px)}.brand{transform:translateZ(60px)}.go{transform:translateZ(85px)}.go:hover{transform:translateZ(95px) translateY(-2px)}.go:active{transform:translateZ(65px) translateY(6px)}.links{transform:translateZ(50px)}.whatsapp{transform:translateZ(45px)}
@media(max-width:700px){.card{border-radius:30px}.pn{transform:translateZ(50px)}h1{transform:translateZ(35px)}.brand{transform:translateZ(25px)}.go{transform:translateZ(40px)}.go:hover{transform:translateZ(40px)}.links{transform:translateZ(20px)}}

<script>
(function(){
const tilt=document.getElementById('tilt'),reduced=matchMedia('(prefers-reduced-motion:reduce)'),fine=matchMedia('(pointer:fine)');
let frame=0,hover=false,x=0,y=0,tx=0,ty=0,start=performance.now();
function move(e){if(reduced.matches||!fine.matches)return;hover=true;tx=Math.max(-1,Math.min(1,e.clientX/innerWidth*2-1));ty=Math.max(-1,Math.min(1,e.clientY/innerHeight*2-1))}
function animate(now){if(reduced.matches){reset();return}if(!hover){const k=(now-start)/1800;tx=Math.sin(k)*.16;ty=Math.cos(k*.8)*.09}x+=(tx-x)*.085;y+=(ty-y)*.085;
tilt.style.setProperty('--ry',(x*18).toFixed(3)+'deg');tilt.style.setProperty('--rx',(-y*14).toFixed(3)+'deg');tilt.style.setProperty('--mx',(50+x*35).toFixed(2)+'%');tilt.style.setProperty('--my',(50+y*35).toFixed(2)+'%');tilt.style.setProperty('--drift-x',(x*15).toFixed(2)+'px');tilt.style.setProperty('--drift-y',(y*11).toFixed(2)+'px');
frame=requestAnimationFrame(animate)}
function reset(){cancelAnimationFrame(frame);frame=0;x=y=tx=ty=0;tilt.style.setProperty('--rx','0deg');tilt.style.setProperty('--ry','0deg');tilt.style.setProperty('--drift-x','0px');tilt.style.setProperty('--drift-y','0px')}
window.addEventListener('pointermove',move,{passive:true});document.documentElement.addEventListener('pointerleave',()=>{hover=false});window.addEventListener('blur',()=>{hover=false});
reduced.addEventListener('change',()=>{reset();if(!reduced.matches)frame=requestAnimationFrame(animate)});if(!reduced.matches)frame=requestAnimationFrame(animate);
})();
</script>
